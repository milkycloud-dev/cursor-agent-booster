name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse the embedded PowerShell
        shell: pwsh
        run: |
          $t = [IO.File]::ReadAllText("CursorAgentBooster.cmd")
          $i = $t.LastIndexOf("::PS1::")
          if ($i -lt 0) { throw "marker missing" }
          $ps = $t.Substring($i + 7)
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseInput($ps, [ref]$null, [ref]$errors)
          if ($errors.Count) { $errors | ForEach-Object { Write-Host $_.Message }; exit 1 }
          Write-Host "ok: $($ps.Length) chars"

      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" '/^## / {p = ($2 == v); next} p' CHANGELOG.md > notes.md
          test -s notes.md || echo "Release $GITHUB_REF_NAME" > notes.md

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: AgentDNA ${{ github.ref_name }}
          body_path: notes.md
          files: CursorAgentBooster.cmd
